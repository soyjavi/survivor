<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>survivor · reader</title>
<style>
@font-face { font-family: 'Literata'; font-weight: 400; font-display: swap; src: url(literata-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: 'Literata'; font-weight: 700; font-display: swap; src: url(literata-latin-700-normal.woff2) format('woff2'); }
@font-face { font-family: 'Geist'; font-weight: 100 900; font-display: swap; src: url(geist.woff2) format('woff2'); }
:root { --bg:#0B0B0C; --panel:#111112; --line:#222225; --line2:#2A2A2E; --text:#EDEDED; --muted:#8F8F8F; --accent:#7DB4FF; --hover:#1A1A1D; }
:root[data-theme="light"] { --bg:#F5F5F3; --panel:#FFFFFF; --line:#E2E2E0; --line2:#CFCFCC; --text:#1A1A1A; --muted:#5F6368; --accent:#1A6FD6; --hover:#EEF0F2; }
* { box-sizing: border-box; border-radius: 0; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Geist', system-ui, sans-serif; }
header a#back { display: inline-flex; width: 36px; height: 36px; align-items: center; justify-content: center; color: var(--text); border: 1px solid var(--line2); background: var(--panel); flex: none; }
header a#back svg { width: 18px; height: 18px; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; gap: 14px; align-items: center; }
header a { color: var(--accent); text-decoration: none; font-size: 14px; }
header span { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
article { max-width: 680px; margin: 0 auto; padding: 32px 28px 110px; font-family: 'Literata', Georgia, serif; line-height: 1.75; font-size: 18px; color: var(--text); }
article p { margin: 0 0 1.05em; }
article ul, article ol { padding-left: 1.4em; margin: 0 0 1.05em; }
article li { margin-bottom: .35em; }
article h1, article h2, article h3, article h4 { font-family: 'Literata', Georgia, serif; line-height: 1.3; margin: 1.6em 0 .6em; }
article h2 { font-size: 1.35em; } article h3 { font-size: 1.15em; } article h4 { font-size: 1.05em; }

.meta { color: var(--muted); font-size: 13px; margin-bottom: 26px; display: flex; flex-wrap: wrap; gap: 10px; }
.meta a { color: var(--accent); }
article h2, article h3 { margin-top: 1.6em; font-weight: 600; }
article img { max-width: 100%; height: auto; display: block; margin: 14px 0; border: 1px solid var(--line); }
article a { color: var(--accent); }
article table { border-collapse: collapse; margin: 14px 0; font-size: 15px; }
article td, article th { border: 1px solid var(--line2); padding: 6px 8px; }
article pre, article code { background: var(--panel); }
article pre { padding: 10px; overflow-x: auto; }
article blockquote { border-left: 2px solid var(--line2); margin: 14px 0; padding: 0 14px; color: var(--muted); }
#theme { position: fixed; right: 20px; bottom: 20px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: var(--panel); border: 1px solid var(--line2); color: var(--text); cursor: pointer; padding: 0; }
#theme svg { width: 20px; height: 20px; }
body.embed #theme { display: none; }
header a#back svg path { }
header .tags { display: flex; gap: 6px; flex-wrap: wrap; }
header .tags span { border: 1px solid var(--line2); padding: 1px 6px; font-size: 11px; color: var(--muted); }
body.embed article { padding: 26px 22px 80px; font-size: 17px; }
</style>
</head>
<body>
<header><a id="back" href="index.html" aria-label="Back" title="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path id="backIcon" d="M19 12H5M12 19l-7-7 7-7"/></svg></a><span id="crumb"></span></header>
<article id="doc"><p>Loading…</p></article>
<button id="theme" type="button" aria-label="Toggle light or dark mode" title="Toggle light or dark mode"></button>
<script src="lib/marked.umd.js"></script>
<script>
const THEME_KEY = 'survivor.theme';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function applyTheme(mode) {
  document.documentElement.dataset.theme = mode;
  $('theme').innerHTML = mode === 'light'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
}
$('theme').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  applyTheme(next);
});
applyTheme(localStorage.getItem(THEME_KEY) || 'dark');
if (new URLSearchParams(location.search).get('embed')) {
  document.body.classList.add('embed');
  $('backIcon').setAttribute('d', 'M6 6l12 12M18 6L6 18');
  $('back').setAttribute('aria-label', 'Close');
  $('back').addEventListener('click', (e) => { e.preventDefault(); const pn = window.parent && window.parent.document.getElementById('panel'); if (pn) pn.classList.remove('open'); });
}

function parse(text) {
  if (!text.startsWith('---')) return { fm: {}, body: text };
  const parts = text.split(/^---$/m);
  const raw = parts[1];
  const fm = {};
  let key = null;
  for (const line of raw.split('\n')) {
    const kv = line.match(/^([a-z_]+):\s*(.*)$/);
    if (kv) { key = kv[1]; fm[key] = kv[2].trim(); }
    else if (key && line.trim().startsWith('- ')) { fm[key] = (Array.isArray(fm[key]) ? fm[key] : []).concat(line.trim().slice(2)); }
  }
  return { fm, body: parts.slice(2).join('\n---\n') };
}

async function load() {
  const f = new URLSearchParams(location.search).get('f');
  if (!f) { $('doc').innerHTML = '<p>No document.</p>'; return; }
  if (!/^okf\/[A-Z]{3}\/[a-z0-9-]+\.md$/.test(f)) { $('doc').innerHTML = '<p>Document not found.</p>'; return; }
  const url = new URL(f, location.href);
  const text = await fetch(url).then((r) => r.text());
  const { fm, body } = parse(text);
  document.title = (fm.title || 'survivor') + ' · survivor';
  const tagList = (Array.isArray(fm.tags) ? fm.tags : [fm.tags]).filter(Boolean).slice(0, 1);
  $('crumb').innerHTML = `<span style="color:var(--text);font-size:14px">${esc(fm.title || '')}</span> <span class="tags">${tagList.map((x) => '<span>' + esc(x) + '</span>').join('')}</span>`;
  const html = marked.parse(body);
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  tmp.querySelectorAll('img').forEach((img) => { img.src = new URL(img.getAttribute('src'), url).href; });
  tmp.querySelectorAll('a[href]').forEach((a) => {
    const h = a.getAttribute('href');
    if (/\.md($|#)/.test(h) && !/^[a-z]+:/i.test(h)) a.href = 'reader.html?f=' + encodeURIComponent(new URL(h.split('#')[0], url).pathname.replace(/^\/+/, ''));
  });
  const meta = [];
  if (fm.resource && /^https?:/.test(fm.resource)) meta.push(`<a href="${esc(fm.resource)}" rel="noopener">source</a>`);
  $('doc').innerHTML = `<div class="meta">${meta.join(' ')}</div>` + tmp.innerHTML;
}
load().catch(() => { $('doc').innerHTML = '<p>Document not found.</p>'; });
</script>
</body>
</html>
